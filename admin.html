<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SM. TaskNova - Admin Panel</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #0f0f13; color: #ffffff; min-height: 100vh; padding: 20px; padding-bottom: 80px; }
        
        /* ================= হেডার ================= */
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 15px; }
        .admin-header h2 { color: #f39c12; font-size: 18px; }
        .close-btn { background: #ff4f4f20; color: #ff4f4f; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer;}
        
        /* ================= ট্যাব স্টাইল ================= */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; background: #1e1e24; color: #aaa; font-weight: bold; font-size: 13px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 6px;}
        .tab-btn.active { background: #f39c12; color: #fff; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.3); }
        
        /* ================= কার্ড স্টাইল ================= */
        .admin-card { background: #1e1e24; border: 1px solid #333; border-radius: 15px; padding: 15px; margin-bottom: 15px; display: none; }
        .admin-card.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ================= ইউজার ও উইথড্র লিস্ট ================= */
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 10px; }
        .user-row:last-child { border-bottom: none; }
        .user-info b { color: #fff; display: block; font-size: 14px; }
        .user-info small { color: #888; font-size: 11px; }
        
        /* ================= বাটন স্টাইল ================= */
        .btn-gold { padding: 8px 12px; border-radius: 8px; border: none; background: #f39c1220; color: #f39c12; font-weight: bold; font-size: 11px; cursor: pointer;}
        .btn-red { padding: 8px 12px; border-radius: 8px; border: none; background: #ff4f4f20; color: #ff4f4f; font-weight: bold; font-size: 11px; cursor: pointer;}
        .btn-blue { padding: 8px 12px; border-radius: 8px; border: none; background: rgba(0, 136, 204, 0.2); color: #0088cc; font-weight: bold; font-size: 11px; cursor: pointer;}
        .btn-green { padding: 8px 12px; border-radius: 8px; border: none; background: rgba(39, 174, 96, 0.2); color: #27ae60; font-weight: bold; font-size: 11px; cursor: pointer;}
        .btn-danger { background: #ff4f4f; color: #fff; }
        
        /* ================= ইনপুট স্টাইল ================= */
        .admin-input { width: 100%; padding: 12px; background: #121212; border: 1px solid #444; border-radius: 10px; color: #fff; margin-bottom: 10px; font-family: 'Poppins';}
        .admin-input:focus { border-color: #f39c12; outline: none; }
        
        /* ================= নোটিফিকেশন কন্ট্রোল ================= */
        .msg-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .msg-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #121212; color: #888; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .msg-btn.active { background: #0088cc20; border-color: #0088cc; color: #0088cc; }
        
        .user-pick { padding: 10px; background: #121212; border: 1px solid #333; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .user-pick:active { border-color: #f39c12; }
        .selected-user { padding: 12px; background: rgba(243, 156, 18, 0.1); border: 1px solid rgba(243, 156, 18, 0.3); border-radius: 8px; margin-bottom: 15px; display: none; }
        
        /* ================= টোস্ট ================= */
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #f39c12; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.5); opacity: 0; transition: 0.3s; z-index: 9999; text-align: center; width: max-content; max-width: 90%;}
    </style>
</head>
<body>

    <div class="admin-header">
        <h2><i class="fa-solid fa-shield-halved"></i> ADMIN PANEL</h2>
        <button class="close-btn" onclick="window.close()">EXIT ✕</button>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" id="btn-tab-users" onclick="switchTab('usersTab')"><i class="fa-solid fa-users"></i> Users</button>
        <button class="tab-btn" id="btn-tab-wd" onclick="switchTab('wdTab')"><i class="fa-solid fa-money-bill-transfer"></i> Withdraw</button>
        <button class="tab-btn" id="btn-tab-msg" onclick="switchTab('msgTab')"><i class="fa-solid fa-paper-plane"></i> Message</button>
    </div>

    <!-- ================= ১. ইউজার প্যানেল ================= -->
    <div id="usersTab" class="admin-card active">
        <input type="text" id="searchUser" class="admin-input" placeholder="🔍 Search User by Name or ID..." onkeyup="renderUsers()">
        <div id="adminUserList" style="max-height: 500px; overflow-y: auto;">
            <p style="color: #888; font-size: 12px; text-align: center;">Loading users...</p>
        </div>
    </div>

    <!-- ================= ২. উইথড্র প্যানেল ================= -->
    <div id="wdTab" class="admin-card">
        <div id="adminWdList" style="max-height: 500px; overflow-y: auto;">
            <p style="color: #888; font-size: 12px; text-align: center;">Loading withdrawals...</p>
        </div>
    </div>

    <!-- ================= ৩. মেসেজ প্যানেল ================= -->
    <div id="msgTab" class="admin-card">
        <div class="msg-toggle">
            <button id="btn-msg-all" class="msg-btn active" onclick="setMsgMode('all')">📢 ALL USERS</button>
            <button id="btn-msg-one" class="msg-btn" onclick="setMsgMode('one')">👤 ONE USER</button>
        </div>

        <div id="userSelectBox" style="display: none;">
            <input type="text" id="searchMsgUser" class="admin-input" placeholder="🔍 Search user to message..." onkeyup="renderMsgUsers()">
            <div id="msgUserList" style="max-height: 200px; overflow-y: auto;"></div>
            <div id="selectedUserBox" class="selected-user">
                <small style="color: #888;">Selected User:</small>
                <b id="selUserName" style="display: block; color: #f39c12; font-size: 15px;">-</b>
            </div>
        </div>

        <label style="color: #aaa; font-size: 12px; margin-bottom: 5px; display: block;">Message Title</label>
        <input type="text" id="msgTitle" class="admin-input" placeholder="e.g. Special Bonus!">

        <label style="color: #aaa; font-size: 12px; margin-bottom: 5px; display: block;">Message Body</label>
        <textarea id="msgBody" class="admin-input" rows="4" placeholder="Type your detailed message here..."></textarea>

        <button class="btn-gold" style="width: 100%; padding: 15px; font-size: 14px; margin-top: 5px;" onclick="sendMessage()">
            <i class="fa-solid fa-paper-plane"></i> Send Message
        </button>
    </div>

    <div id="customToast" class="toast"></div>

    <script>
        const API_URL = "https://tasknova-6mjt.onrender.com"; 
        let allUsers = [];
        let allWds = [];
        let msgMode = 'all';
        let selectedUserId = null;

        window.onload = () => {
            fetchUsers();
            fetchWithdrawals();
        };

        // ================= ট্যাব কন্ট্রোল =================
        function switchTab(tabId) {
            document.querySelectorAll('.admin-card').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            if(tabId === 'usersTab') document.getElementById('btn-tab-users').classList.add('active');
            if(tabId === 'wdTab') document.getElementById('btn-tab-wd').classList.add('active');
            if(tabId === 'msgTab') document.getElementById('btn-tab-msg').classList.add('active');
        }

        // ================= ডাটা ফেচ =================
        async function fetchUsers() {
            try {
                const res = await fetch(`${API_URL}/api/admin/users?t=${Date.now()}`);
                allUsers = await res.json();
                renderUsers();
            } catch(e) { showToast("Failed to load users."); }
        }

        async function fetchWithdrawals() {
            try {
                const res = await fetch(`${API_URL}/api/admin/withdrawals?t=${Date.now()}`);
                allWds = await res.json();
                renderWds();
            } catch(e) { showToast("Failed to load withdrawals."); }
        }

        // ================= রেন্ডার ফাংশন =================
        function renderUsers() {
            const query = document.getElementById('searchUser').value.toLowerCase();
            const list = document.getElementById('adminUserList');
            
            let filtered = allUsers;
            if(query) {
                filtered = allUsers.filter(u => 
                    (u.name && u.name.toLowerCase().includes(query)) || 
                    u.id.includes(query)
                );
            }

            if(filtered.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#888;">No users found.</p>`;
                return;
            }

            list.innerHTML = filtered.map(u => `
                <div class="user-row">
                    <div class="user-info">
                        <b>${u.name || 'User'} ${u.banned ? '<span style="color:#ff4f4f; font-size:10px;">(BANNED)</span>' : ''}</b>
                        <small>ID: ${u.id.substring(0,8)}... | Bal: $${(u.balance || 0).toFixed(2)}</small>
                    </div>
                    <div style="display:flex; gap:5px; flex-wrap: wrap; justify-content: flex-end;">
                        <button class="btn-blue" onclick="quickMsg('${u.id}', '${u.name}')"><i class="fa-solid fa-comment-dots"></i></button>
                        <button class="btn-gold" onclick="updateBalance('${u.id}', 'add')">+ Add</button>
                        <button class="btn-red" onclick="updateBalance('${u.id}', 'subtract')">- Cut</button>
                        
                        ${u.banned 
                            ? `<button class="btn-green" onclick="banUser('${u.id}', 'unban')"><i class="fa-solid fa-unlock"></i></button>`
                            : `<button class="btn-red" onclick="banUser('${u.id}', 'ban')"><i class="fa-solid fa-ban"></i></button>`
                        }
                        <button class="btn-red btn-danger" onclick="deleteUser('${u.id}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `).join('');
        }

        function renderWds() {
            const list = document.getElementById('adminWdList');
            if(allWds.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:#888;">No pending withdrawals.</p>`;
                return;
            }

            list.innerHTML = allWds.map(w => `
                <div class="user-row" style="flex-direction: column; align-items: flex-start; gap: 10px; background: #121212; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333;">
                    <div class="user-info" style="width: 100%;">
                        <b>User: ${w.name || 'User'}</b>
                        <small>Amount: <span style="color:#27ae60;">$${w.amount}</span> | Method: ${w.method}</small>
                        <small>Number: ${w.number}</small>
                    </div>
                    <div style="display:flex; gap:10px; width: 100%;">
                        <button class="btn-blue" style="flex:1;" onclick="quickMsg('${w.userId}', '${w.name}')"><i class="fa-solid fa-comment"></i> Msg</button>
                        <button class="btn-gold" style="flex:1;" onclick="processWd('${w.id}', 'approve')">✅ Approve</button>
                        <button class="btn-red" style="flex:1;" onclick="processWd('${w.id}', 'reject')">❌ Reject</button>
                    </div>
                </div>
            `).join('');
        }

        // ================= অ্যাকশন ফাংশন =================
        async function updateBalance(userId, action) {
            const title = action === 'add' ? "How much to add?" : "How much to cut?";
            const amount = prompt(title);
            if(!amount) return;
            const amt = parseFloat(amount);
            if(isNaN(amt) || amt <= 0) return showToast("Invalid amount!");

            await fetch(`${API_URL}/api/admin/update-balance`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: userId, amount: amt, action: action })
            });
            showToast("✅ Balance Updated!");
            fetchUsers();
        }

        async function processWd(wdId, action) {
            if(!confirm(`Are you sure you want to ${action} this?`)) return;
            await fetch(`${API_URL}/api/admin/process-withdraw`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ wdId: wdId, action: action })
            });
            showToast(`✅ Withdrawal ${action}d!`);
            fetchWithdrawals();
            fetchUsers();
        }

        // নতুন: ব্যান/আনব্যান ফাংশন
        async function banUser(userId, action) {
            if(!confirm(`Are you sure you want to ${action} this user?`)) return;
            await fetch(`${API_URL}/api/admin/ban-user`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: userId, action: action })
            });
            showToast(`✅ User ${action}ned!`);
            fetchUsers();
        }

        // নতুন: ডিলিট ফাংশন
        async function deleteUser(userId) {
            if(!confirm("Are you sure? This will permanently delete the user and all their data!")) return;
            await fetch(`${API_URL}/api/admin/delete-user`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: userId })
            });
            showToast("✅ User deleted successfully!");
            fetchUsers();
        }

        // ================= মেসেজ সিস্টেম =================
        function setMsgMode(mode) {
            msgMode = mode;
            if(mode === 'all') {
                document.getElementById('btn-msg-all').classList.add('active');
                document.getElementById('btn-msg-one').classList.remove('active');
                document.getElementById('userSelectBox').style.display = 'none';
                selectedUserId = null;
            } else {
                document.getElementById('btn-msg-one').classList.add('active');
                document.getElementById('btn-msg-all').classList.remove('active');
                document.getElementById('userSelectBox').style.display = 'block';
                document.getElementById('selectedUserBox').style.display = 'none';
                renderMsgUsers();
            }
        }

        function quickMsg(userId, name) {
            switchTab('msgTab');
            setMsgMode('one');
            selectedUserId = userId;
            document.getElementById('selUserName').innerText = name;
            document.getElementById('selectedUserBox').style.display = 'block';
        }

        function renderMsgUsers() {
            const query = document.getElementById('searchMsgUser').value.toLowerCase();
            const list = document.getElementById('msgUserList');
            
            let filtered = allUsers;
            if(query) {
                filtered = allUsers.filter(u => 
                    (u.name && u.name.toLowerCase().includes(query)) || 
                    u.id.includes(query)
                );
            }

            list.innerHTML = filtered.slice(0, 10).map(u => `
                <div class="user-pick" onclick="selectMsgUser('${u.id}', '${u.name}')">
                    <b style="color:#fff;">${u.name || 'User'}</b> <small style="color:#f39c12;">#${u.id.substring(0,6)}</small>
                </div>
            `).join('');
        }

        function selectMsgUser(id, name) {
            selectedUserId = id;
            document.getElementById('selUserName').innerText = name;
            document.getElementById('selectedUserBox').style.display = 'block';
            document.getElementById('msgUserList').innerHTML = '';
            document.getElementById('searchMsgUser').value = '';
        }

        async function sendMessage() {
            const title = document.getElementById('msgTitle').value.trim();
            const body = document.getElementById('msgBody').value.trim();
            
            if(!title || !body) return showToast("Please enter both Title and Body.");

            const finalText = `✦ 𝗦𝗠 𝐓𝐀𝐒𝐊 𝐍𝐎𝐕𝐀 ✦\n\n🎯 **${title}**\n\n${body}`;

            if(msgMode === 'all') {
                if(!confirm("Send this message to ALL users?")) return;
                try {
                    const res = await fetch(`${API_URL}/api/admin/broadcast`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ text: finalText })
                    });
                    const data = await res.json();
                    showToast(`✅ Sent to ${data.sent} users!`);
                    document.getElementById('msgTitle').value = '';
                    document.getElementById('msgBody').value = '';
                } catch(e) { showToast("Failed to send broadcast."); }
            } else {
                if(!selectedUserId) return showToast("Please select a user first.");
                try {
                    const res = await fetch(`${API_URL}/api/admin/send-message`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ userId: selectedUserId, text: finalText })
                    });
                    const data = await res.json();
                    if(data.status === 'success') {
                        showToast("✅ Message sent successfully!");
                        document.getElementById('msgTitle').value = '';
                        document.getElementById('msgBody').value = '';
                        document.getElementById('selectedUserBox').style.display = 'none';
                        selectedUserId = null;
                    } else {
                        showToast("❌ Failed: " + data.message);
                    }
                } catch(e) { showToast("Network Error!"); }
            }
        }

        // ================= টোস্ট =================
        function showToast(msg) {
            const t = document.getElementById('customToast');
            t.innerText = msg;
            t.style.opacity = '1';
            t.style.bottom = '30px';
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.bottom = '20px';
            }, 3000);
        }
    </script>
</body>
          </html>

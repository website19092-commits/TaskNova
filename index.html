<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SM. TaskNova - Premium</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src='//libtl.com/sdk.js' data-zone='12143232' data-sdk='show_12143232'></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Hind+Siliguri:wght@400;600;700&display=swap');
        :root {
            --bg: #050907; --panel: #0b1411; --panel2: #101b17;
            --green: #00d39b; --gold: #d8b66a; --gold2: #f4df9b;
            --text: #f5f7f6; --muted: #8c9a95; --line: rgba(255,255,255,.08);
            --pink: #e2136e; --red: #ff4f4f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; overflow-x: hidden; }
        
        /* Loader */
        #loader { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: var(--bg); transition: .5s; }
        .loader-ring { width: 60px; height: 60px; border: 3px solid rgba(0,211,155,.1); border-top: 3px solid var(--green); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }

        /* Main App */
        header { position: sticky; top: 0; padding: 15px 20px; background: rgba(5,9,7,.9); backdrop-filter: blur(20px); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .user-info h2 { font-size: 16px; font-weight: 800; }
        .user-info p { font-size: 11px; color: var(--muted); }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #162c22; border: 2px solid var(--green); display: flex; align-items: center; justify-content: center; font-weight: bold; background-size: cover; }

        .page { display: none; padding: 20px; }
        .page.active { display: block; animation: fadeIn .3s; }
        .balance-card { background: linear-gradient(135deg, #10231b, #09100d); border: 1px solid var(--line); border-radius: 22px; padding: 25px; text-align: center; margin-bottom: 20px; }
        .balance-card h1 { font-size: 38px; font-weight: 900; color: var(--green); margin: 10px 0; }
        
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .action-card { background: var(--panel); border: 1px solid var(--line); padding: 20px 15px; border-radius: 18px; text-align: center; cursor: pointer; }
        .action-card i { font-size: 26px; color: var(--green); margin-bottom: 10px; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #0b1411; border-top: 1px solid var(--line); display: flex; justify-content: space-around; padding: 12px 0; z-index: 1000; }
        .nav-item { text-align: center; color: var(--muted); font-size: 10px; cursor: pointer; font-weight: 600; }
        .nav-item.active { color: var(--green); }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 4px; }

        /* ================= PREMIUM ADMIN PANEL ================= */
        #adminPanel { display: none; background: radial-gradient(circle at 50% 0%, #0a1a13, #050907); min-height: 100vh; padding: 20px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 211, 155, 0.2); }
        .admin-header h2 { color: var(--gold2); font-size: 18px; text-shadow: 0 0 10px rgba(244, 223, 155, 0.4); display: flex; align-items: center; gap: 8px;}
        .close-btn { background: rgba(255,79,79,0.1); color: var(--red); border: 1px solid rgba(255,79,79,0.3); padding: 8px 15px; border-radius: 10px; font-weight: bold; font-size: 12px; }
        
        .admin-tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; padding-bottom: 5px; }
        .admin-tab { padding: 12px 20px; border-radius: 12px; background: #0c1612; color: var(--muted); border: 1px solid rgba(255,255,255,0.05); white-space: nowrap; font-size: 12px; font-weight: bold; transition: 0.3s;}
        .admin-tab.active { background: linear-gradient(135deg, var(--green), #00a978); color: #03100b; border-color: var(--green); box-shadow: 0 5px 15px rgba(0,211,155,0.3);}

        .admin-card { background: rgba(11, 20, 17, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 18px; padding: 20px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .admin-card h3 { color: #fff; font-size: 14px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .admin-input { width: 100%; padding: 15px; background: #050907; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; margin-bottom: 12px; outline: none; font-size: 13px;}
        .admin-input:focus { border-color: var(--green); }
        
        .btn-green { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--green), #00a978); color: #03100b; font-weight: 800; font-size: 13px; }
        .btn-red { padding: 8px 12px; border-radius: 8px; border: none; background: rgba(255,79,79,0.15); color: var(--red); font-weight: bold; font-size: 11px; }
        .btn-gold { padding: 8px 12px; border-radius: 8px; border: none; background: rgba(216,182,106,0.15); color: var(--gold2); font-weight: bold; font-size: 11px; }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .user-row:last-child { border-bottom: none; }
        .user-info b { color: #fff; font-size: 14px; display: block;}
        .user-info small { display: block; color: var(--muted); font-size: 11px; margin-top: 4px; }
        .badge { padding: 3px 8px; border-radius: 6px; font-size: 9px; background: rgba(0,211,155,0.1); color: var(--green); border: 1px solid rgba(0,211,155,0.2);}

    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div style="text-align:center;">
            <div class="loader-ring"></div>
            <h2 style="color: var(--green); font-size: 18px;">SM. TaskNova</h2>
        </div>
    </div>

    <!-- User App -->
    <div id="userApp" style="display:none;">
        <header>
            <div class="user-info">
                <h2 id="userName">Loading...</h2>
                <p>ID: <span id="userId">...</span></p>
            </div>
            <div class="avatar" id="userAvatar">U</div>
        </header>

        <div id="homePage" class="page active">
            <div class="balance-card">
                <h3>Total Balance</h3>
                <h1 id="userBalance">$0.00</h1>
            </div>
            <div class="grid-container">
                <div class="action-card" onclick="watchAd()">
                    <i class="fa-solid fa-circle-play"></i>
                    <h4>Watch & Earn</h4>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i>Home</div>
            <div class="nav-item"><i class="fa-solid fa-wallet"></i>Wallet</div>
        </div>
    </div>

    <!-- ================= PREMIUM ADMIN PANEL ================= -->
    <div id="adminPanel">
        <div class="admin-header">
            <h2><i class="fa-solid fa-shield-halved"></i> PREMIUM CONTROL</h2>
            <button class="close-btn" onclick="tg.close()">EXIT ✕</button>
        </div>

        <div class="admin-tabs">
            <button class="admin-tab active" onclick="switchAdminTab('usersTab', this)">👥 Users</button>
            <button class="admin-tab" onclick="switchAdminTab('notifyTab', this)">📢 Broadcast</button>
        </div>

        <!-- Users Tab -->
        <div id="usersTab">
            <div class="admin-card">
                <h3>All Registered Users</h3>
                <div id="adminUserList" style="margin-top:15px; max-height: 450px; overflow-y: auto;">
                    <p style="color:var(--muted); font-size:12px;">Loading users...</p>
                </div>
            </div>
        </div>

        <!-- Notify Tab -->
        <div id="notifyTab" style="display:none;">
            <div class="admin-card">
                <h3>Broadcast Notification</h3>
                <p style="font-size:11px; color:var(--muted); margin-bottom:15px;">Send a message directly to all users' Telegram.</p>
                <textarea class="admin-input" id="broadcastText" rows="4" placeholder="Type your premium message here..."></textarea>
                <button class="btn-green" onclick="sendBroadcast()">🚀 SEND TO ALL</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();

        const API_URL = "https://tasknova-6mjt.onrender.com";
        const ADMIN_ID = "8021210361"; // আপনার আইডি
        let user = tg.initDataUnsafe?.user;
        
        // Check if Admin Mode
        const isAdminMode = new URLSearchParams(window.location.search).get('admin') === '1';

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                
                // সিকিউরিটি চেক: আপনি অ্যাডমিন কি না?
                if (isAdminMode) {
                    if (user && user.id.toString() === ADMIN_ID) {
                        document.getElementById('adminPanel').style.display = 'block';
                        loadAdminUsers();
                    } else {
                        tg.showAlert("⛔ Access Denied! You are not the Admin.");
                        setTimeout(() => tg.close(), 2000);
                    }
                } else {
                    document.getElementById('userApp').style.display = 'block';
                    initUser();
                }
            }, 1000);
        });

        function initUser() {
            if (user) {
                document.getElementById('userName').innerText = user.first_name;
                document.getElementById('userId').innerText = user.id;
                const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${user.id}`;
                document.getElementById('userAvatar').style.backgroundImage = `url(${avatarUrl})`;
                document.getElementById('userAvatar').innerText = "";
                fetchUserData();
            }
        }

        async function fetchUserData() {
            if(!user) return;
            try {
                const res = await fetch(`${API_URL}/api/user?userId=${user.id}`);
                const data = await res.json();
                document.getElementById('userBalance').innerText = `$${(data.balance || 0).toFixed(2)}`;
            } catch(e) {}
        }

        function watchAd() {
            if(typeof show_12143232 !== 'function') return tg.showAlert("Ad SDK not loaded.");
            show_12143232().then(() => {
                tg.showAlert("🎉 Ad watched! $0.01 added.");
                addReward(0.01);
            }).catch(() => tg.showAlert("❌ Ad failed."));
        }

        async function addReward(amt) {
            if(!user) return;
            await fetch(`${API_URL}/api/reward`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({userId: user.id, amount: amt})
            });
            fetchUserData();
        }

        // ================= ADMIN FUNCTIONS =================
        function switchAdminTab(tabId, el) {
            document.getElementById('usersTab').style.display = 'none';
            document.getElementById('notifyTab').style.display = 'none';
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            
            document.getElementById(tabId).style.display = 'block';
            el.classList.add('active');
        }

        async function loadAdminUsers() {
            const list = document.getElementById('adminUserList');
            try {
                const res = await fetch(`${API_URL}/api/admin/users`);
                const users = await res.json();
                
                if(users.length === 0) {
                    list.innerHTML = "<p style='color:var(--muted);'>No users found.</p>";
                    return;
                }

                list.innerHTML = users.map(u => `
                    <div class="user-row">
                        <div class="user-info">
                            <b>${u.name || 'User'} <span class="badge">ID: ${u.id.substring(0,6)}</span></b>
                            <small>Balance: $${(u.balance || 0).toFixed(2)} | Hold: $${(u.hold_balance || 0).toFixed(2)}</small>
                        </div>
                        <div style="display:flex; gap:5px;">
                            <button class="btn-gold" onclick="promptBalance('${u.id}', 'add')">+ Add</button>
                            <button class="btn-red" onclick="promptBalance('${u.id}', 'subtract')">- Cut</button>
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                list.innerHTML = "<p style='color:red;'>Failed to load users.</p>";
            }
        }

        async function promptBalance(userId, action) {
            const title = action === 'add' ? "কত ডলার যোগ করবেন?" : "কত ডলার কাটবেন?";
            const amount = prompt(title + " (e.g., 0.50)");
            if(!amount) return;
            
            const amt = parseFloat(amount);
            if(isNaN(amt) || amt <= 0) return tg.showAlert("সঠিক পরিমাণ লিখুন!");

            await fetch(`${API_URL}/api/admin/update-balance`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ userId: userId, amount: amt, action: action })
            });
            loadAdminUsers();
            tg.showAlert("✅ Balance Updated Successfully!");
        }

        async function sendBroadcast() {
            const text = document.getElementById('broadcastText').value;
            if(!text) return tg.showAlert("Please enter a message.");
            
            tg.showAlert("Sending broadcast...");
            const res = await fetch(`${API_URL}/api/admin/broadcast`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ text: text })
            });
            const data = await res.json();
            tg.showAlert(`✅ Message sent to ${data.sent} users!`);
            document.getElementById('broadcastText').value = '';
        }
    </script>
</body>
</html>
